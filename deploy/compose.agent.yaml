services:
  agent:
    image: ghcr.io/zahuiron/sing-box-manager-agent:${MANAGER_VERSION:-latest}
    restart: unless-stopped
    environment:
      AGENT_PORT: "${AGENT_PORT:-9091}"
      AGENT_TOKEN: "${AGENT_TOKEN:-}"
      AGENT_TOKEN_FILE: "${AGENT_TOKEN_FILE:-/var/lib/sing-box/agent.key}"
      AGENT_TLS_CERT: "${AGENT_TLS_CERT:-}"
      AGENT_TLS_KEY: "${AGENT_TLS_KEY:-}"
      AGENT_TLS_DOMAIN: "${AGENT_TLS_DOMAIN:-}"
      AGENT_ACME_DIR: "${AGENT_ACME_DIR:-}"
      SING_BOX_BINARY: "${SING_BOX_BINARY:-/var/lib/sing-box/bin/sing-box}"
      SING_BOX_VERSION: "${SING_BOX_VERSION:-latest}"
      SING_BOX_AUTO_INSTALL: "${SING_BOX_AUTO_INSTALL:-true}"
      SING_BOX_CONFIG: "${SING_BOX_CONFIG:-/etc/sing-box/config.json}"
      SING_BOX_WORK_DIR: /var/lib/sing-box
      SING_BOX_AUTO_START: "${SING_BOX_AUTO_START:-true}"
    ports:
      - "${AGENT_PORT:-9091}:${AGENT_PORT:-9091}"
    volumes:
      - "${SING_BOX_CONFIG_DIR:-./sing-box}:/etc/sing-box"
      - "${SING_BOX_DATA_DIR:-./data}:/var/lib/sing-box"
      - "${SING_BOX_DATA_DIR:-./data}/certmagic:/root/.local/share/certmagic"
